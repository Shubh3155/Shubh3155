name: Refresh profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'
  push:
    paths:
      - '.github/workflows/profile.yml'
      - 'scripts/update_profile.py'
      - 'scripts/activity_graph.py'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Shubh3155/Shubh3155'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate overview
        uses: stats-organization/github-readme-stats-action@v2
        with:
          fail_on_error: true
          card: stats
          options: username=Shubh3155&show_icons=true&include_all_commits=true&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage&hide_border=true&bg_color=0d1117&title_color=a78bfa&icon_color=67e8f9&text_color=c9d1d9&rank_icon=default
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          fail_on_error: true
          card: top-langs
          options: username=Shubh3155&layout=donut-vertical&langs_count=8&hide_border=true&bg_color=0d1117&title_color=a78bfa&text_color=c9d1d9
          path: assets/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shubh3155
          outputs: |
            assets/snake.svg?color_snake=#7c3aed
            assets/snake-dark.svg?palette=github-dark&color_snake=#a78bfa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate recent contribution graph
        run: python3 scripts/activity_graph.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Connect generated images to README
        run: python3 scripts/update_profile.py
      - name: Commit refreshed visuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/activity.svg assets/stats.svg assets/languages.svg assets/snake.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh profile visuals'
          git push
